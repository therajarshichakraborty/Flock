services:
  mongodb:
    image: mongo:latest
    container_name: flock-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: flock
    volumes:
      - mongodb_data:/data/db

  # Optional web-based MongoDB admin interface
  mongo-express:
    image: mongo-express:latest
    container_name: flock-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
